name = "ciq-supabase-keepalive"
main = "src/index.js"
compatibility_date = "2026-09-02"

# cron は UTC。1 日 2 回 = 12:00 JST / 00:00 JST。
# 7 日の停止猶予に対して 14 回投げるので、数回失敗しても止まらない。
[triggers]
# 5 分おきの cron は繰り上げ通知の取りこぼしを拾う（src/index.js の PROMOTION_CRON と同じ値にする）。
crons = ["0 3,15 * * *", "*/5 * * * *"]

# ここに置く 2 値は js/supabase_config.js でクライアントに配信済みの公開値。
# 秘密ではないので Secret ではなく vars でよい（service_role キーは絶対に置かない）。
[vars]
SUPABASE_URL = "https://pyzdlkwumhreepgkrcyb.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wiuKyYbhmIS8SPkcqxccsw_GdFbv72b"
KEEPALIVE_PATH = "/rest/v1/public_project_settings?select=project_id&limit=1"

# HEALTHCHECK_URL はここに書かない。リポジトリは public で、あの ping URL は
# 「叩けば生存扱いにできる」capability URL のため、公開すると障害を隠蔽されうる。
# 設定は Secret 経由:
#   npx wrangler secret put HEALTHCHECK_URL
# 未設定でも keepalive 本体は動く（通知だけがスキップされる）。

# 繰り上げ通知の合言葉も Secret で設定する（Edge Function 側の CIQ_CRON_SECRET と同じ値）:
#   npx wrangler secret put CIQ_CRON_SECRET
