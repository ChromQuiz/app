<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self'; img-src 'self' data: blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png?v=4">
  <meta name="description" content="CIQ - クイズ大会のペーパー運営を、エントリーから成績返却まで。">
  <meta property="og:title" content="CIQ">
  <meta property="og:description" content="クイズ大会のペーパー運営を、エントリーから成績返却まで。">
  <meta property="og:type" content="website">
  <title>CIQ</title>
  <script defer src="js/config.js?v=2"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.min.js" integrity="sha384-fx4y4cDx8NYfissnVzdGJY3yVXWY3rn5ab5HTUjpvgT35oDiyAbjjqnLhnRmESNE" crossorigin="anonymous"></script>
  <script defer src="js/supabase_config.js?v=2"></script>
  <script defer src="js/supabase_client.js"></script>
  <script defer src="js/supabase_api.js?v=35"></script>
  <script defer src="js/crypto.js"></script>
  <script defer src="js/icons.js?v=8"></script>
  <script defer src="js/ui.js?v=20"></script>
  <script defer src="js/shared.js?v=2"></script>
  <link rel="stylesheet" href="css/design_system.css?v=73">
  <link rel="stylesheet" href="css/pages.css?v=116">
</head>

<body class="page-index">
  <div class="card" id="join">
    <div class="auth-page-header">
      <h1 class="index-app-title">CIQ</h1>
      <h2 id="index-mode-title">ログイン</h2>
    </div>

    <div id="status-msg" class="status-msg-box" role="alert" aria-live="assertive"></div>

    <div id="supabase-auth-panel" class="auth-provider-panel" hidden>
      <div class="auth-provider-main">
        <div class="auth-provider-user" id="supabase-auth-user"></div>
      </div>
      <div class="auth-provider-actions">
        <button type="button" class="btn secondary google-auth-btn" id="supabase-login-btn">
          <img class="google-g-mark" src="assets/vendor/google/g_mark.svg" alt="" aria-hidden="true">
          <span>Googleで続行</span>
        </button>
        <button type="button" class="btn secondary google-auth-btn" id="supabase-logout-btn" hidden>
          <img class="google-g-mark" src="assets/vendor/google/g_mark.svg" alt="" aria-hidden="true">
          Googleからサインアウト
        </button>
      </div>
    </div>

    <!-- 参加(既定): 自分のプロジェクト / 採点者参加 -->
    <div id="section-join" hidden>
      <div id="project-list" class="project-list">
      </div>
      <p class="desc-text scorer-join-note">
        採点者として参加するには、管理者から共有された招待リンクを開いてください。
      </p>
    </div>

    <!-- 作成(#create でのみ表示・主催者向け) -->
    <div id="section-create" hidden>
      <p class="desc-text mb-md">大会の回数を入力すると、プロジェクトIDが発行されます。採点者は管理画面から招待リンクを発行して招待します。</p>
      <label for="create-edition">回数（例：第13回 → 13）</label>
      <input type="number" id="create-edition" placeholder="13" min="1" max="999" />
      <button class="btn u-full-width mt-md" id="create-btn">プロジェクトを作成</button>
    </div>

    <div id="section-success" class="u-text-center" hidden>
      <h3 class="success-title">作成しました</h3>
      <p class="success-desc">プロジェクトIDです。採点者の招待は管理画面から招待リンクを発行してください。</p>

      <div class="credential-panel" data-stagger>
        <label for="success-id">プロジェクトID</label>
        <div class="credential-row">
          <input type="text" id="success-id" readonly />
          <button class="btn standard credential-copy-btn" data-copy-target="success-id" aria-label="プロジェクトIDをコピー"><span data-icon="copy" aria-hidden="true"></span></button>
        </div>
        </div>
      <button class="btn u-full-width" id="admin-proceed-btn">運営をはじめる</button>
    </div>
  </div>

  <div class="nav-tiles">
    <a href="#" class="nav-tile u-hidden" id="index-join-link">採点者の方はこちら <span data-icon="arrow-right" aria-hidden="true"></span></a>
    <a href="#create" class="nav-tile u-hidden" id="index-create-link">大会を主催する方へ <span data-icon="arrow-right" aria-hidden="true"></span></a>
    <a href="help.html" class="nav-tile">ヘルプ <span data-icon="arrow-right" aria-hidden="true"></span></a>
  </div>
  <script defer src="js/index.js?v=17"></script>
</body>
</html>
