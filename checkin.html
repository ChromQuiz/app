<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self'; img-src 'self' data: blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png?v=4">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="description" content="CIQ - クイズ大会のペーパー運営を支援するプラットフォーム">
    <title>CIQ - 受付</title>
    <script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" integrity="sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx" crossorigin="anonymous"></script>
    <script defer src="js/config.js?v=4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.min.js" integrity="sha384-fx4y4cDx8NYfissnVzdGJY3yVXWY3rn5ab5HTUjpvgT35oDiyAbjjqnLhnRmESNE" crossorigin="anonymous"></script>
    <script defer src="js/supabase_config.js?v=2"></script>
    <script defer src="js/supabase_client.js?v=2"></script>
    <script defer src="js/supabase_api.js?v=69"></script>
    <script defer src="js/crypto.js"></script>
    <script defer src="js/icons.js?v=10"></script>
    <script defer src="js/ui.js?v=41"></script>
    <script defer src="js/shared.js?v=7"></script>
    <link rel="stylesheet" href="css/design_system.css?v=110">
    <link rel="stylesheet" href="css/pages.css?v=198">
</head>
<body class="page-checkin">
    <!-- 集中モードシェル: 戻る + 現在位置 + 設定(運営だけが使う。受付状況・カメラ) -->
    <div class="fixed-header ops-focus-bar">
        <div class="header-left">
            <button type="button" class="back-nav-btn icon-only" id="checkin-back-btn" aria-label="戻る" title="戻る"><span data-icon="chevron-left" aria-hidden="true"></span></button>
        </div>
        <div class="header-center">
            <h1 id="page-title">受付</h1>
        </div>
        <div class="header-right">
            <button type="button" class="back-nav-btn icon-only" id="checkin-settings-btn" aria-label="受付の設定" title="受付の設定"><span data-icon="gear" aria-hidden="true"></span></button>
        </div>
    </div>

    <!-- 参加者が画面に向かって二次元コードをかざす前提のレイアウト:
         左=大きなカメラ(かざす場所) / 右=大きな判定結果(参加者と担当者の両方が読む) -->
    <div class="main-content" role="main">
        <div class="left-col">
            <div id="camera-container">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
                <div class="checkin-guide" aria-hidden="true">
                    <div class="checkin-guide-frame"></div>
                </div>
            </div>
            <p id="scanning-text" role="status" aria-live="polite">二次元コードを、枠の中にかざしてください。</p>
            <!-- 受付番号での手入力受付はこの画面には置かない。
                 この画面は参加者が二次元コードをかざすために覗き込む前提で、受付番号は公開情報のため、
                 番号だけで受付状態を書き換えられる操作を参加者の目の前に残さない。
                 手入力は運営専用ページ(admin.html)に置いている。 -->
            <p class="checkin-manual-note">二次元コードが読めないときは、運営に伝えてください。</p>
        </div>

        <div class="right-col">
            <div class="checkin-result-panel">
                <div class="checkin-idle" id="checkin-idle" aria-hidden="true">
                    <span data-icon="qrcode" aria-hidden="true"></span>
                    <p class="checkin-idle-title">読み取り待機中</p>
                </div>
                <div id="result" class="checkin-result" role="status" aria-live="assertive" hidden></div>
            </div>
        </div>
    </div>

    <dialog class="checkin-settings" id="checkin-settings" aria-labelledby="checkin-settings-title">
        <h2 id="checkin-settings-title">受付の設定</h2>
        <dl class="checkin-conn">
            <div class="checkin-conn-row">
                <dt>受付状況</dt>
                <dd id="checkin-tally">-</dd>
            </div>
            <div class="checkin-conn-row">
                <dt>カメラ</dt>
                <dd id="checkin-camera-state">起動中</dd>
                <div class="checkin-conn-actions">
                    <button type="button" class="btn secondary" id="checkin-camera-restart">カメラを再起動する</button>
                </div>
            </div>
        </dl>
        <div class="checkin-settings-actions">
            <button type="button" class="btn secondary" id="checkin-settings-close">閉じる</button>
        </div>
    </dialog>

    <script defer src="js/checkin_result_view.js?v=2"></script>
    <script defer src="js/checkin.js?v=25"></script>
</body>
</html>
